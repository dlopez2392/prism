name: CI

# Prism's gates, exactly as a contributor runs them locally — so CI and a
# terminal cannot disagree about what "green" means. No secrets: the unit
# suite, the build and the browser tests run on the demo household, and the
# signed-in browser tests on a throwaway Supabase stack on this runner.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Reads the pinned version from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # As Vercel runs it: inside the production build, with production's
      # settings in the environment. Placeholders, never real values; the
      # suite must pin them all off (src/lib/env-pins.test.ts).
      - run: pnpm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          PLAID_CLIENT_ID: ci-placeholder
          PLAID_SECRET: ci-placeholder
          PLAID_ENV: production
          PRISM_VAULT_KEY: Y2ktcGxhY2Vob2xkZXItMzItYnl0ZXMtLS0tLS0tLS0=
          PRISM_VAULT_KEY_2: Y2ktcGxhY2Vob2xkZXItcmVwbGFjZW1lbnQta2V5LTI=
          COINBASE_CLIENT_ID: ci-placeholder
          COINBASE_CLIENT_SECRET: ci-placeholder
      - run: pnpm build
      # The signed-in browser tests' database: a LOCAL Supabase stack
      # (supabase/config.toml), built from supabase/migrations on this runner
      # and gone with it. Nothing hosted and no secret, so production is out
      # of reach; e2e/accounts/stack.ts refuses anything that isn't this
      # machine's all the same. The CLI is pinned: it pins the stack's images.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - run: supabase start -x imgproxy,postgres-meta,supavisor,vector,logflare
      # The built app in a real browser, at desktop and phone widths
      # (playwright.config.ts): the example household, and signed in on the
      # local stack. Part of verify, so the rule that guards main requires it
      # without a new required check.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
