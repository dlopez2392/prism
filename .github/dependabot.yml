# Dependabot: security fixes and a weekly, grouped round of updates.
#
# Security updates arrive as soon as GitHub knows about a vulnerability
# ("Dependabot security updates" must be switched on in the repository's
# Settings → Code security). The weekly version updates are grouped so they
# come as a couple of pull requests, not dozens. Every one runs CI (type-check,
# lint, tests, build) before it can be merged.

version: 2
updates:
  - package-ecosystem: "npm" # also reads pnpm-lock.yaml
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # Node's type definitions must describe the Node that runs Prism
      # (package.json engines: 22.x, as on Vercel and in CI). A newer major
      # would type-check APIs production doesn't have. Move them WITH the
      # runtime, in the same change that raises engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
